<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منصة المبادرات | مدارس ابن رشد</title><style>
:root{--navy:#122f4b;--blue:#17668b;--gold:#c8a25d;--bg:#f4f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:#21364b}header{background:linear-gradient(115deg,#102e49,#185d7d);color:white;padding:23px 6%;box-shadow:0 4px 18px #0002}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:13px}.logo{width:67px;height:67px;border:2px solid var(--gold);border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--gold);background:#ffffff12}.brand h2{margin:0;font-size:22px}.brand small{color:#d9e8f1}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;cursor:pointer;background:var(--gold);color:#142c43}.btn.secondary{background:#e5eef4;color:var(--navy)}.btn.danger{background:#fae3e3;color:#a32b2b}.hero{text-align:center;padding:49px 15px 24px}.hero .tag{color:var(--blue);font-weight:bold}.hero h1{font-size:clamp(27px,5vw,42px);margin:12px 0}.hero p{color:#607486}.line{height:4px;width:75px;background:var(--gold);border-radius:9px;margin:19px auto}.wrap{max-width:1180px;margin:auto;padding:15px 22px 70px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:19px}.tile{background:white;border:1px solid #e2eaf0;border-radius:17px;box-shadow:0 6px 20px #1b3b5510;padding:24px;min-height:213px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;position:relative;overflow:hidden}.tile:before{content:'';position:absolute;right:0;top:0;width:5px;height:100%;background:var(--gold)}.symbol{width:48px;height:48px;background:#eaf4f8;border-radius:13px;display:grid;place-items:center;color:var(--blue);font-size:24px}.tile h3{font-size:18px;line-height:1.6;margin:14px 0}.tile a{color:var(--blue);font-weight:bold;text-decoration:none}.tile .muted{color:#9ba7b0;font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{padding:9px 12px}.panel{max-width:620px;margin:24px auto;background:white;border-radius:16px;padding:25px;box-shadow:0 8px 24px #0001}.hidden{display:none!important}label{display:block;margin:15px 0 7px;font-weight:bold}input{width:100%;padding:13px;border:1px solid #cbd7e0;border-radius:9px;font:inherit}input:focus{outline:2px solid #7bb5d0}footer{text-align:center;padding:24px;color:#7b8a96;border-top:1px solid #dce6ec}.notice{margin:14px 0;color:#a04429}.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 20px}.toolbar h2{margin:0}.count{background:#e6edf2;border-radius:40px;padding:7px 12px;color:#37566b}#message{min-height:24px;color:#9c4627}.empty{text-align:center;color:#718494;padding:40px}
</style></head><body><header><div class="top"><div class="brand"><div class="logo" id="schoolLogo">ابن</div><div><h2>مدارس ابن رشد الأهلية</h2><small>جازان | البوابة الرقمية للمبادرات</small></div></div><button class="btn" id="adminButton">دخول الإدارة</button></div></header><section class="hero"><div class="tag">IBN RUSHD SCHOOLS</div><h1>منصة المبادرات المدرسية</h1><div class="line"></div><p>مبادرات نوعية تصنع الأثر وترتقي بالتعليم</p></section><main class="wrap"><section id="login" class="panel hidden"><h2>دخول لوحة التحكم</h2><label for="password">كلمة مرور الإدارة</label><input id="password" type="password" autocomplete="off" placeholder="أدخل كلمة المرور"><p id="loginMsg" class="notice"></p><button class="btn" id="loginSubmit">دخول</button> <button class="btn secondary" id="cancelLogin">إلغاء</button></section><section id="editor" class="panel hidden"><h2 id="editorTitle">إضافة مبادرة</h2><label for="initiativeName">اسم المبادرة</label><input id="initiativeName" maxlength="180" placeholder="اسم المبادرة"><label for="initiativeUrl">رابط ملف المبادرة</label><input id="initiativeUrl" type="url" placeholder="https://... (اختياري)"><p id="message"></p><button class="btn" id="save">حفظ المبادرة</button> <button class="btn secondary" id="reset">إلغاء التعديل</button> <button class="btn secondary" id="logout">خروج الإدارة</button></section><div class="toolbar"><h2>مبادراتنا</h2><span class="count" id="count">جارٍ التحميل...</span></div><div id="grid" class="grid"></div></main><footer>مدارس ابن رشد الأهلية © 2026 | منصة المبادرات</footer><script>
const BASE='https://tuojlwdfqoiohkkcuqqj.supabase.co',KEY='sb_publishable_6ohoPmG4cUZslRgMtV15rw_2KSMU5Lr';let adminPassword='',editing=null,items=[];
const $=id=>document.getElementById(id);const show=(id,on)=>$(id).classList.toggle('hidden',!on);
async function api(path,options={}){let r=await fetch(BASE+'/rest/v1/'+path,{...options,headers:{apikey:KEY,'Content-Type':'application/json',...options.headers}});let data=await r.json().catch(()=>null);if(!r.ok)throw Error(data?.message||data?.hint||'تعذر الاتصال بقاعدة البيانات');return data;}
async function command(action,id=null,title=null,url=null,pass=adminPassword){return api('rpc/manage_school_initiative',{method:'POST',body:JSON.stringify({p_password:pass,p_action:action,p_id:id,p_title:title,p_url:url})});}
function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function render(){let grid=$('grid');grid.replaceChildren();$('count').textContent=items.length+' مبادرات';if(!items.length){grid.append(el('p','empty','لا توجد مبادرات حالياً'));return;}items.forEach((x,i)=>{let tile=el('article','tile'),symbol=el('div','symbol','✦'),name=el('h3','',x.title),bottom=el('div');tile.append(symbol,name);if(x.file_url){let a=el('a','', 'عرض ملف المبادرة ↗');a.href=x.file_url;a.target='_blank';a.rel='noopener noreferrer';bottom.append(a);}else bottom.append(el('span','muted','سيتم إضافة رابط الملف قريباً'));if(adminPassword){let buttons=el('div','controls'),edit=el('button','btn secondary','تعديل'),del=el('button','btn danger','حذف');edit.onclick=()=>{editing=x.id;$('initiativeName').value=x.title;$('initiativeUrl').value=x.file_url||'';$('editorTitle').textContent='تعديل المبادرة';$('editor').scrollIntoView({behavior:'smooth'});};del.onclick=async()=>{if(!confirm('هل تريد حذف هذه المبادرة؟'))return;try{await command('delete',x.id);await load()}catch(e){alert(e.message)}};buttons.append(edit,del);bottom.append(buttons)}tile.append(bottom);grid.append(tile)})}
async function load(){try{items=await api('school_initiatives?select=id,title,file_url,sort_order&order=sort_order.asc,id.asc');render()}catch(e){$('count').textContent='تعذر التحميل';$('grid').replaceChildren(el('p','notice','يرجى تنفيذ ملف setup.sql في Supabase أولاً. '+e.message))}}
$('adminButton').onclick=()=>{if(adminPassword){show('editor',true);$('editor').scrollIntoView({behavior:'smooth'});}else{show('login',true);$('login').scrollIntoView({behavior:'smooth'})}};
$('cancelLogin').onclick=()=>show('login',false);
$('loginSubmit').onclick=async()=>{let p=$('password').value;$('loginMsg').textContent='جارٍ التحقق...';try{await command('verify',null,null,null,p);adminPassword=p;$('password').value='';$('loginMsg').textContent='';show('login',false);show('editor',true);render()}catch(e){$('loginMsg').textContent=e.message}};
function reset(){editing=null;$('initiativeName').value='';$('initiativeUrl').value='';$('editorTitle').textContent='إضافة مبادرة';$('message').textContent=''}$('reset').onclick=reset;
$('logout').onclick=()=>{adminPassword='';reset();show('editor',false);render()};
$('save').onclick=async()=>{let title=$('initiativeName').value.trim(),url=$('initiativeUrl').value.trim();if(!title){$('message').textContent='يرجى إدخال اسم المبادرة';return}if(url&&!/^https?:\/\/\S+$/i.test(url)){$('message').textContent='يرجى إدخال رابط صحيح يبدأ بـ https://';return}try{$('message').textContent='جارٍ الحفظ...';await command(editing?'edit':'add',editing,title,url);reset();await load()}catch(e){$('message').textContent=e.message}};
load();
</script></body></html>
