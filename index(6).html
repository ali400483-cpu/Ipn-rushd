<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منصة المبادرات | مدارس ابن رشد بجازان</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--green:#275e49;--teal:#64aaa3;--ink:#203d43;--bg:#f3f8f5}*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;box-shadow:0 2px 14px #173b3220}nav{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;gap:15px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:100px;height:78px;object-fit:contain}.brand strong{font-size:19px;color:var(--green)}.brand small{display:block;color:#68847d;margin-top:4px}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:700}button.primary,.btn{background:var(--green);color:white}button.secondary{background:#e4f0eb;color:var(--green)}button.danger{background:#fae6e5;color:#a02c2c}button:hover,.btn:hover{filter:brightness(.94)}main{max-width:1100px;margin:0 auto;padding:28px 18px 60px}.hero{background:linear-gradient(115deg,#245b47,#418c80);color:white;border-radius:24px;padding:35px 25px;text-align:center}.hero img{background:white;border-radius:16px;width:185px;height:135px;object-fit:contain;padding:8px}.hero h1{font-size:clamp(25px,5vw,38px);margin:17px 0 6px}.hero p{margin:0;color:#e5f5ef}.heading{display:flex;align-items:center;justify-content:space-between;margin:30px 0 16px;gap:12px}.heading h2{margin:0;font-size:25px}.count{color:#5c7d72}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.initiative{background:white;border:1px solid #dceae3;border-radius:19px;padding:24px;min-height:180px;box-shadow:0 8px 22px #285a4810;display:flex;flex-direction:column;justify-content:space-between}.initiative .symbol{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:#e6f2ed;color:var(--green);font-size:23px}.initiative h3{margin:14px 0;font-size:21px;line-height:1.5}.initiative a{color:var(--green);font-weight:800;text-decoration:none}.muted{color:#81918c;font-size:14px}.panel{background:white;border:1px solid #dceae3;border-radius:20px;padding:25px;margin-top:25px;box-shadow:0 6px 20px #285a4810}.panel h2{margin-top:0}label{display:block;font-weight:700;margin:14px 0 7px}input{font:inherit;width:100%;padding:13px;border:1px solid #bfd4ca;border-radius:10px;outline-color:var(--teal)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.item-row{border-top:1px solid #e6eee9;padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.item-row strong{overflow-wrap:anywhere}.item-row small{display:block;color:#81918c;margin-top:5px}.hide{display:none!important}.notice{margin-top:15px;color:#9c3c32;font-weight:700}.success{color:#26794c}footer{text-align:center;padding:24px;color:#779087}@media(max-width:600px){.brand img{width:70px;height:62px}.brand strong{font-size:15px}nav{padding:9px}.item-row{align-items:flex-start;flex-direction:column}}
</style></head><body><header><nav><div class="brand"><img src="school-logo.jpg" alt="شعار مدارس ابن رشد بجازان"><div><strong>مدارس ابن رشد – جازان</strong><small>منصة المبادرات المدرسية</small></div></div><button class="secondary" id="toggleAdmin">لوحة التحكم 🔒</button></nav></header><main><section class="hero"><img src="school-logo.jpg" alt="شعار مدارس ابن رشد"><h1>منصة المبادرات المدرسية</h1><p>مبادرات نوعية تصنع الأثر وتدعم التميز</p></section><section id="home"><div class="heading"><h2>مبادراتنا</h2><span class="count" id="count"></span></div><div id="cards" class="cards"><p>جارٍ تحميل المبادرات...</p></div></section><section id="admin" class="hide"><div class="panel" id="loginPanel"><h2>دخول مسؤول المبادرات</h2><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="off" placeholder="أدخل كلمة المرور"><div class="actions"><button class="primary" id="loginBtn">دخول</button><button class="secondary" id="backBtn">عودة للرئيسية</button></div><div class="notice" id="loginMsg"></div></div><div id="editor" class="hide"><div class="panel"><h2 id="formTitle">إضافة مبادرة جديدة</h2><label for="name">اسم المبادرة</label><input id="name" maxlength="160" placeholder="اسم المبادرة"><label for="url">رابط ملف المبادرة (اختياري)</label><input id="url" type="url" placeholder="https://..."><div class="actions"><button class="primary" id="saveBtn">حفظ المبادرة</button><button class="secondary" id="cancelBtn">إلغاء التعديل</button><button class="secondary" id="logoutBtn">تسجيل الخروج</button></div><div id="formMsg" class="notice"></div></div><div class="panel"><h2>إدارة المبادرات</h2><div id="adminList"></div></div></div></section></main><footer>مدارس ابن رشد بجازان © منصة المبادرات</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const URL_BASE='https://tuojlwdfqoiohkkcuqqj.supabase.co',KEY='sb_publishable_6ohoPmG4cUZslRgMtV15rw_2KSMU5Lr';const db=window.supabase.createClient(URL_BASE,KEY);let items=[],adminPassword='',editingId=null;const $=id=>document.getElementById(id);const show=(el,yes)=>$(el).classList.toggle('hide',!yes);function message(id,text,good=false){$(id).textContent=text;$(id).classList.toggle('success',good)}function safeUrl(u){try{let x=new URL(u);return x.protocol==='https:'?x.href:null}catch{return null}}
async function load(){const {data,error}=await db.from('school_initiatives').select('id,name,file_url,sort_order').order('sort_order').order('id');if(error){$('cards').textContent='تعذر تحميل المبادرات. نفّذ ملف setup.sql في Supabase أولاً.';return}items=data||[];render()}
function render(){const root=$('cards');root.replaceChildren();$('count').textContent=items.length+' مبادرات';if(!items.length){root.textContent='لا توجد مبادرات بعد';return}items.forEach((it,i)=>{let c=document.createElement('article');c.className='initiative';let s=document.createElement('div');s.className='symbol';s.textContent='✦';let h=document.createElement('h3');h.textContent=it.name;let a=document.createElement('div'),u=safeUrl(it.file_url);if(u){let link=document.createElement('a');link.href=u;link.target='_blank';link.rel='noopener noreferrer';link.textContent='الاطلاع على ملف المبادرة ←';a.append(link)}else{a.className='muted';a.textContent='سيُضاف رابط الملف قريبًا'}c.append(s,h,a);root.append(c)});renderAdmin()}
function renderAdmin(){let root=$('adminList');root.replaceChildren();items.forEach(it=>{let row=document.createElement('div');row.className='item-row';let txt=document.createElement('div'),strong=document.createElement('strong');strong.textContent=it.name;let small=document.createElement('small');small.textContent=it.file_url||'لا يوجد رابط';txt.append(strong,small);let acts=document.createElement('div');acts.className='actions';let edit=document.createElement('button');edit.className='secondary';edit.textContent='تعديل';edit.onclick=()=>{editingId=it.id;$('name').value=it.name;$('url').value=it.file_url||'';$('formTitle').textContent='تعديل المبادرة';message('formMsg','');$('name').focus()};let del=document.createElement('button');del.className='danger';del.textContent='حذف';del.onclick=async()=>{if(!confirm('هل تريد حذف هذه المبادرة؟'))return;await manage('delete',it.id)};acts.append(edit,del);row.append(txt,acts);root.append(row)})}
function home(){show('home',true);show('admin',false)}$('toggleAdmin').onclick=()=>{let isHidden=$('admin').classList.contains('hide');show('home',!isHidden);show('admin',isHidden);$('toggleAdmin').textContent=isHidden?'الصفحة الرئيسية':'لوحة التحكم 🔒';if(!isHidden)home()};$('backBtn').onclick=home;
async function rpc(action,id=null,name=null,url=null,pw=adminPassword){return db.rpc('manage_school_initiative',{p_password:pw,p_action:action,p_id:id,p_name:name,p_url:url})}
$('loginBtn').onclick=async()=>{let pw=$('password').value;if(!pw){message('loginMsg','أدخل كلمة المرور');return}let {error}=await rpc('verify',null,null,null,pw);if(error){message('loginMsg',error.message.includes('function')?'نفّذ ملف setup.sql في Supabase أولاً.':'كلمة المرور غير صحيحة أو تعذر الاتصال');return}adminPassword=pw;$('password').value='';message('loginMsg','');show('loginPanel',false);show('editor',true);renderAdmin()};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};
async function manage(action,id=null){let name=null,url=null;if(action!=='delete'){name=$('name').value.trim();url=$('url').value.trim();if(!name){message('formMsg','يرجى كتابة اسم المبادرة');return}if(url&&!safeUrl(url)){message('formMsg','الرابط يجب أن يبدأ بـ https://');return}}$('saveBtn').disabled=true;let {error}=await rpc(action,id,name,url);$('saveBtn').disabled=false;if(error){message('formMsg','تعذر الحفظ: '+error.message);return}editingId=null;$('name').value='';$('url').value='';$('formTitle').textContent='إضافة مبادرة جديدة';message('formMsg','تم الحفظ بنجاح',true);await load()}
$('saveBtn').onclick=()=>manage(editingId===null?'add':'edit',editingId);$('cancelBtn').onclick=()=>{editingId=null;$('name').value='';$('url').value='';$('formTitle').textContent='إضافة مبادرة جديدة';message('formMsg','')};$('logoutBtn').onclick=()=>{adminPassword='';show('editor',false);show('loginPanel',true);home()};load();
</script></body></html>
